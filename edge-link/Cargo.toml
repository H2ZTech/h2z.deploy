[package]
name = "edge-link"
version = "0.1.0"
edition = "2021"
description = "h2z edge-link: HTTP over iroh. `edge` serves on the NVR box, `viewer` is the loopback client core (later reused by the Tauri desktop shell)."
license = "UNLICENSED"

[dependencies]
iroh = "1.4.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "fs", "sync", "signal"] }
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["stream", "rustls-tls"] }
hyper = { version = "1", features = ["server", "http1"] }
hyper-util = { version = "0.1", features = ["tokio", "server", "http1"] }
http-body-util = "0.1"
bytes = "1"
futures-util = "0.3"
tokio-stream = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
qrcode = { version = "0.14.1", default-features = false }
sha2 = "0.11"

[profile.release]
lto = "thin"
opt-level = 3
