map $http_upgrade $connection_upgrade { default upgrade; '' close; }
server {
    listen 80;
    server_name _;
    absolute_redirect off;
    root /usr/share/nginx/html;
    client_max_body_size 100m;
    # 上游按名字每次重新解析（Docker 内置 DNS）：backend / zlm / emqx 单独重建换了 IP 时 nginx 不会一直连旧地址报 502
    #（写死在 proxy_pass 里的名字只在 nginx 启动时解析一次）。
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $up_backend backend:3001;
    set $up_zlm zlm:80;
    set $up_link edge-link:8099;
    set $up_emqx emqx:8083;
    location = /healthz { return 200 'ok'; add_header Content-Type text/plain; }
    location = / { return 302 /ioc/; }
    location = /ioc { return 302 /ioc/; }
    # 前端缓存（同 h2z.ioc deploy/nginx.conf）：index.html 不缓存——更新前端镜像后普通刷新就拿到新版本，不用 Ctrl+Shift+R；
    # 打包出来的 assets 文件名带内容哈希，可以长缓存
    location /ioc/assets/ { try_files $uri =404; add_header Cache-Control "public, max-age=31536000, immutable"; }
    location = /ioc/index.html { add_header Cache-Control "no-store"; }
    location /ioc/ { add_header Cache-Control "no-store"; try_files $uri $uri/ /ioc/index.html; }
    # Same as 云端生产环境/nginx.conf: strip /api and pass to the native host
    # (local_module services are mounted at /ioc, /security, ...).
    location /api/ {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$up_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 真实来源地址（覆盖，不追加：客户端自己带的 X-Forwarded-For 不算数）：口令错误限流、审计按人算
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
    # H2Z OS 整包升级包（约 2 GB）：只有这一个地址放开大小，边收边转给后端（不在 nginx 落盘）
    location = /api/ioc/device/network/upgrade/upload {
        rewrite ^/api/(.*) /$1 break;
        proxy_pass http://$up_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # 真实来源地址（覆盖，不追加：客户端自己带的 X-Forwarded-For 不算数）：口令错误限流、审计按人算
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        client_max_body_size 8g;
        proxy_request_buffering off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
    # Browser uses IOC's authenticated AI relay. Never expose h2z-api service credentials.
    location /api/h2z/ { return 404; }
    location = /mqtt {
        proxy_pass http://$up_emqx/mqtt;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_read_timeout 3600s;
    }
    # iroh 边缘状态（只读摘要，不含端点 ID / 配对信息 / 查看者列表）：edge-link 没起来时这里回 502，界面据此显示「未运行」。
    location = /h2z-link/summary {
        proxy_pass http://$up_link/summary;
        proxy_http_version 1.1;
        proxy_connect_timeout 2s;
        proxy_read_timeout 5s;
        add_header Cache-Control "no-store";
    }
    location /media/index/api/ { return 403; }
    location /media/ {
        rewrite ^/media/(.*) /$1 break;
        proxy_pass http://$up_zlm;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_buffering off;
        proxy_read_timeout 3600s;
    }
}
