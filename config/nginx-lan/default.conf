# H2Z 新装机（C 线 docker2/ 和 H2Z OS）的网页入口，三个 server 共用同一份 locations.inc（契约 §13.2，docs/link/lan-web-login.md）：
#   :80  对外入口（compose 发布成 HTTP_BIND:HTTP_PORT，缺省 8096）= 局域网浏览器用。H2Z_LAN_AUTH=on（缺省）时，除登录页、静态资源、
#        /api/login、/healthz 等少数地址外，/api /media /mqtt 都要先过 auth_request（backend 的 GET /account/check，204 放行 / 401 拒绝）。
#   :81  内部入口（只在 compose 内网，永远不发布、不加 auth_request）：edge-link 的上游。手机经 iroh 进来的请求边缘已经验过令牌，不要再登录。
#   :82  本机屏幕入口（compose 只发布成 127.0.0.1:LOCAL_HTTP_PORT，缺省 8097；不加 auth_request）：HDMI 本地控制台和本机脚本用，
#        本机物理接触即信任，「预览免登录、进菜单要口令」保持原状。
# 老现场（仓库根 compose.yaml）仍用 config/nginx.conf，一个字没动。
map $http_upgrade $connection_upgrade { default upgrade; '' close; }
# 对外入口里「项目的只读接口」不在 nginx 拦登录：项目开放就让人直接看，项目要登录由 IOC 自己按项目回 401 / 403
# （docs/AUTH-REDESIGN.md：项目访问名单里有人 = 要登录，没人 = 开放）。写操作（非 GET）、后台、设备、账号接口仍要先登录。
# 只放：项目读接口 /api/ioc/projects/…、实时状态、页面启动要读的几个公共清单；口令入口 POST|DELETE …/access 和 POST /query/run。
map "$request_method:$request_uri" $h2z_ioc_public {
    default 0;
    "~^(GET|HEAD):/api/ioc/(projects|live|capabilities|templates|system/metrics|device/capabilities|device/packs|catalog/queries|ai/scenarios)([/?].*)?$" 1;
    "~^(POST|DELETE):/api/ioc/projects/[A-Za-z0-9_-]+/access/?(\?.*)?$" 1;
    "~^POST:/api/ioc/query/run/?(\?.*)?$" 1;
}
server {
    listen 80;
    server_name _;
    include /etc/nginx/h2z/server-common.inc;
    # 对外入口：lan-auth-on.inc 打开 auth_request（缺省）；lan-auth-off.inc 是空的 = 和以前一样不登录（H2Z_LAN_AUTH=off 逃生开关）
    include /etc/nginx/h2z/lan-auth.inc;
    include /etc/nginx/h2z/locations.inc;
}
server {
    listen 81;
    server_name _;
    include /etc/nginx/h2z/server-common.inc;
    include /etc/nginx/h2z/locations.inc;
}
server {
    listen 82;
    server_name _;
    include /etc/nginx/h2z/server-common.inc;
    include /etc/nginx/h2z/locations.inc;
}
