# RK3588 板上启用 ZLM 硬件转码（hevc_rkmpp → h264_rkmpp）。只在有 /dev/mpp_service 的 arm64 板上合并：
#   sh scripts/enable-zlm-hw.sh        # 写入 .env 的 COMPOSE_FILE 与 ZLM_IMAGE，然后 docker compose pull && docker compose up -d
# 开发机 / amd64 不要合并这个文件（没有这些设备，compose 会报错）。
services:
  zlm:
    # 设备节点是 root 600
    user: '0:0'
    # Docker 默认遮住 /sys/firmware：MPP 读不到设备树就认不出 RK3588，H.265 编解码都会被拒（unknown soc）
    security_opt:
      - systempaths=unconfined
    devices:
      - /dev/mpp_service:/dev/mpp_service
      - /dev/rga:/dev/rga
      - /dev/dri:/dev/dri
      - /dev/dma_heap:/dev/dma_heap
    environment:
      H2Z_ZLM_CONFIG: transcode-v7-rkmpp
  backend:
    environment:
      # 后端按这个选转码模板：rkmpp → cmd_h264_hw_*（硬件）；不设 → 原来的 libx264 模板
      IOC_TRANSCODE_HW: rkmpp
